name: CI Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  test:
    name: Run Verification & Syntax Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python Syntax & Imports
        run: |
          python -m py_compile main.py website/__init__.py website/crawler.py telegram/__init__.py telegram/ingestor.py core/__init__.py core/chunker.py core/vector_db.py core/chatbot.py
          python -c "import website, telegram, core; print('All modules imported successfully!')"

  test-brew-install:
    name: Test Homebrew Installation
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rag-Chatbot via Homebrew
        run: |
          brew install Formula/ragchat.rb

      - name: Verify Installation
        run: |
          which ragchat
          ragchat --help || true
