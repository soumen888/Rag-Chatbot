name: CI Pipeline

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  test:
    name: Run Verification & Syntax Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python Syntax & Imports
        run: |
          find . -name "*.py" -type f ! -path "./venv/*" ! -path "./.venv/*" ! -path "./.git/*" -exec python -m py_compile {} +
          python -c "import website, Services.telegram, core; print('All modules imported successfully!')"

  test-install-scripts:
    name: Test Installer Scripts Syntax
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Shell Script Syntax
        run: bash -n install/macos.sh
