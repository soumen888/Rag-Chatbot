version: '3.8'

services:
  doc-chat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: doc-chat
    image: doc-chat:latest
    stdin_open: true  # Enables interactive CLI input
    tty: true         # Allocates pseudo-TTY for rich terminal formatting
    volumes:
      # Mount private core logic
      - ../../Private:/app/ragchat_core
      # Persist ChromaDB database and crawl state caches on host machine
      - ./chroma_db:/app/chroma_db
      - ./.crawl_cache:/app/.crawl_cache

  doc-chat-sync:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: doc-chat-sync
    command: python sync_daemon.py
    restart: unless-stopped
    volumes:
      # Mount private core logic
      - ../../Private:/app/ragchat_core
      - ./chroma_db:/app/chroma_db
      - ./.crawl_cache:/app/.crawl_cache
